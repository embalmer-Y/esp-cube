## EspCube 主组件依赖(ESP Component Registry)
## 版本策略: 以 IDF v6.1 兼容线为准; 编译解析失败时按 registry 实际版本调整。
dependencies:
  idf: ">=6.0,<7.0"
  # QSPI AMOLED 驱动 IC CO5300(鱼鹰光电 2寸 460x460 面板)
  espressif/esp_lcd_co5300: "^2.0.0"
  # LVGL9 移植层(任务/缓冲/刷新管理)
  espressif/esp_lvgl_port: "^2.0.0"
  # codec 统一抽象(ES8311 播放+录音, 板载 Function CoreBoard-1)
  # 2.0.0-beta5 = IDF 6.x 适配线(IDF 5.x 用 1.6.x 线)
  espressif/esp_codec_dev: "==2.0.0-beta5"
  # 软件编解码(MP3/AAC 网络流解码; Opus 编解码供 M2 语音 AI)
  espressif/esp_audio_codec: "^2.6.0"
  # WebSocket 客户端(M2: xiaozhi 协议 / GLM-Realtime)
  espressif/esp_websocket_client: "^1.4.0"
  # MP3 解码已 vendor 至 components/mp3_helix(-O3 编译), 不再用 registry 组件
  # HLS 直播/点播协议栈(国内电台主流): m3u8 解析/分段调度/AES-128 解密
  espressif/esp_hls_stream: "^1.0.4"
  # esp-sr: 离线唤醒(V-04 S31 实测: 唯一可用 wn10_hilexin_int16;
  # Kconfig SR_WN_WN10_HILEXIN_INT16 + MODEL_IN_FLASH 必开)
  # 启用时同步打开 Kconfig: CONFIG_ESP_CUBE_ENABLE_VOICE / ENABLE_AI
  espressif/esp-sr: "^2.6.0"
